<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Impending Arrival Law Group</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style type="text/css">
    html, body {
      background: transparent;
      margin: 0;
      padding: 0;
      font-family: sans-serif;
    }

    #overlay-container {
      width: 640px;
      height: 480px;
      position: relative;
      overflow: hidden;
    }

    /* Skip button - YouTube style */
    #skip {
      display: none;
      position: absolute;
      bottom: 60px;
      right: 0;
      padding: 10px 18px;
      background: rgba(0, 0, 0, 0.75);
      border: 1px solid #aaa;
      border-right-width: 0;
      font-size: 1rem;
      border-radius: 4px 0 0 4px;
      color: white;
      cursor: pointer;
      z-index: 10;
    }

    #skip:hover {
      background: rgba(0,0,0,0.9);
    }

    /* Hold screen overlay */
    #hold-screen {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.82);
      color: white;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      z-index: 20;
      padding: 20px;
      box-sizing: border-box;
    }

    #hold-screen.visible {
      display: flex;
    }

    #hold-logo {
      font-size: 1rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #aaa;
      margin-bottom: 24px;
    }

    #hold-message {
      font-size: 1.3rem;
      font-weight: bold;
      margin-bottom: 16px;
      line-height: 1.4;
    }

    #hold-submessage {
      font-size: 0.85rem;
      color: #aaa;
      font-style: italic;
    }

    #hold-dots {
      margin-top: 24px;
      font-size: 2rem;
      letter-spacing: 0.5em;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }

    /* Rating screen */
    #rating-screen {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.92);
      color: white;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      z-index: 30;
      padding: 30px;
      box-sizing: border-box;
    }

    #rating-screen.visible {
      display: flex;
    }

    #rating-title {
      font-size: 1rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #aaa;
      margin-bottom: 20px;
    }

    #rating-question {
      font-size: 1.3rem;
      font-weight: bold;
      margin-bottom: 30px;
      line-height: 1.4;
    }

    #rating-buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 20px;
    }

    .rating-btn {
      width: 44px;
      height: 44px;
      background: rgba(255,255,255,0.1);
      border: 1px solid #aaa;
      border-radius: 4px;
      color: white;
      font-size: 1rem;
      cursor: pointer;
    }

    .rating-btn:hover {
      background: rgba(255,255,255,0.25);
    }

    #rating-response {
      display: none;
      font-size: 1.5rem;
      font-weight: bold;
      margin-bottom: 10px;
    }

    #rating-sub {
      display: none;
      font-size: 0.85rem;
      color: #aaa;
      font-style: italic;
    }
  </style>
</head>

<body>
  <div id="overlay-container">

    <button id="skip">Skip Ad ›</button>

    <div id="hold-screen">
      <div id="hold-logo">⚖ Impending Arrival Law Group</div>
      <div id="hold-message"></div>
      <div id="hold-submessage"></div>
      <div id="hold-dots">• • •</div>
    </div>

    <div id="rating-screen">
      <div id="rating-title">⚖ Impending Arrival Law Group</div>
      <div id="rating-question">On a scale of 1 to 10, how would you rate this ad?</div>
      <div id="rating-buttons">
        <button class="rating-btn">1</button>
        <button class="rating-btn">2</button>
        <button class="rating-btn">3</button>
        <button class="rating-btn">4</button>
        <button class="rating-btn">5</button>
        <button class="rating-btn">6</button>
        <button class="rating-btn">7</button>
        <button class="rating-btn">8</button>
        <button class="rating-btn">9</button>
        <button class="rating-btn">10</button>
      </div>
      <div id="rating-response">We have recorded your rating.</div>
      <div id="rating-sub">Five out of ten. Not bad.</div>
    </div>

  </div>

  <script type="text/javascript">
    (function(window, document) {

      const skipButton = document.getElementById('skip');
      const holdScreen = document.getElementById('hold-screen');
      const holdMessage = document.getElementById('hold-message');
      const holdSubmessage = document.getElementById('hold-submessage');
      const ratingScreen = document.getElementById('rating-screen');
      const ratingButtons = document.querySelectorAll('.rating-btn');
      const ratingResponse = document.getElementById('rating-response');
      const ratingSub = document.getElementById('rating-sub');
      const audio = new Audio('just-wait-a-moment.mp3');

      let skipCount = 0;
      const MAX_SKIPS = 4; // number of holds before success

      const holdMessages = [
        {
          main: "Please hold. Your call is important to us.",
          sub: "Estimated wait time: impending."
        },
        {
          main: "All representatives are currently assisting other clients.",
          sub: "Your call will be answered in the order it was received."
        },
        {
          main: "Thank you for your patience.",
          sub: "A representative from the Impending Arrival Law Group will be with you shortly."
        },
        {
          main: "Please continue to hold.",
          sub: "Results not guaranteed. Results not typical. Results pending."
        }
      ];

      function showHold() {
        const msg = holdMessages[skipCount % holdMessages.length];
        holdMessage.textContent = msg.main;
        holdSubmessage.textContent = msg.sub;

        // Pause the video and play hold audio
        window.top.postMessage({ type: 'pause' }, '*');
        audio.currentTime = 0;
        audio.play();

        // Blur the video
        window.top.postMessage({ type: 'setVideoFilter', value: 'blur(4px) brightness(0.6)' }, '*');

        // Show hold screen
        holdScreen.classList.add('visible');
        skipButton.style.display = 'none';

        // After 4 seconds, release hold
        setTimeout(() => {
          holdScreen.classList.remove('visible');
          window.top.postMessage({ type: 'setVideoFilter', value: 'none' }, '*');
          window.top.postMessage({ type: 'play' }, '*');
          skipCount++;

          if (skipCount >= MAX_SKIPS) {
            // Final skip - success
            skipButton.textContent = 'Skip Ad ›';
            skipButton.style.display = 'block';
            skipButton.dataset.final = 'true';
          } else {
            skipButton.style.display = 'block';
          }
        }, 4000);
      }

      // Listen for messages from the game shell
      window.addEventListener('message', (event) => {
        if (!event.data || !event.data.type) return;

        if (event.data.type === 'adStarted') {
          // Show skip button after 5 seconds
          setTimeout(() => {
            skipButton.style.display = 'block';
          }, 5000);
        }

        if (event.data.type === 'adFinished') {
          // Video ended - show rating screen
          skipButton.style.display = 'none';
          holdScreen.classList.remove('visible');
          window.top.postMessage({ type: 'setVideoFilter', value: 'blur(4px) brightness(0.4)' }, '*');
          ratingScreen.classList.add('visible');
        }
      });

      // Rating buttons — always respond with "Five out of ten. Not bad."
      ratingButtons.forEach(btn => {
        btn.addEventListener('click', () => {
          document.getElementById('rating-buttons').style.display = 'none';
          document.getElementById('rating-question').style.display = 'none';
          ratingResponse.style.display = 'block';
          ratingSub.style.display = 'block';
          setTimeout(() => {
            window.top.postMessage({ type: 'success' }, '*');
          }, 2500);
        });
      });

      skipButton.addEventListener('click', () => {
        if (skipButton.dataset.final === 'true') {
          // Actually skip
          skipButton.style.display = 'none';
          window.top.postMessage({ type: 'success' }, '*');
        } else {
          showHold();
        }
      });

    })(window, document);
  </script>
</body>
</html>
